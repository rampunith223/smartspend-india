# Render blueprint — SmartSpend India
# Connect this repo in the Render dashboard and this file configures everything.
services:
  - type: web
    name: smartspend-india
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      # Random secret generated by Render on first deploy.
      - key: JWT_SECRET
        generateValue: true
      # Web Push (VAPID) keys — same pair used locally. Keep this repo private.
      - key: VAPID_PUBLIC_KEY
        value: BHcOIeP9foyBujCurZJgtKA5LoDEkc159cvno6biiNDwKYhSL3vsHAPkZhnCx4zaOok5EwfMKo2RZmENjhHOrNk
      - key: VAPID_PRIVATE_KEY
        value: OMpGkXGTUja6ULbEK0OXNw5bsjd-_9-oYIjA1iNSZYA
      - key: VAPID_SUBJECT
        value: "mailto:demo@smartspend.in"
